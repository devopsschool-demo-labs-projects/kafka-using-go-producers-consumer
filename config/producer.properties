# =============================================================================
#  producer.properties  —  PHASE 2: every knob a producer has, and why
# =============================================================================
#
#  Load AFTER cluster.properties:
#      ./bin/producer -cluster config/cluster.properties -config config/producer.properties
#
#  A producer has essentially four dials, and they pull against each other:
#
#      DURABILITY  <---->  LATENCY  <---->  THROUGHPUT  <---->  ORDERING
#
#  Nothing here is universally "correct". The defaults below are tuned for a
#  financial-grade event stream: lose nothing, duplicate nothing, keep per-key
#  order, and accept some latency for it. Every comment tells you which way to
#  turn the dial when your requirements differ.
#
#  ONE THING TO KNOW UP FRONT: librdkafka's defaults are NOT the Java client's
#  defaults. Three of them differ in ways that will bite you:
#      enable.idempotence   librdkafka false,  Java true  (since 3.0)
#      linger.ms            librdkafka 5,      Java 0
#      isolation.level      librdkafka read_committed, Java read_uncommitted
#  Never assume a blog post about "Kafka producer defaults" describes this client.
#
# -----------------------------------------------------------------------------
#  1. DURABILITY  —  what "sent successfully" is allowed to mean
# -----------------------------------------------------------------------------

# How many brokers must confirm the write before the producer calls it done.
#   Values : 0    - fire and forget. The producer never waits and never learns
#                   about failure. Fastest possible, and you WILL lose messages
#                   on any broker restart. Only for metrics you can afford to
#                   drop entirely.
#            1    - the leader alone confirms. Survives nothing: if the leader
#                   dies before its followers replicate, the message is gone AND
#                   the producer was told it succeeded. This is the setting that
#                   quietly loses data.
#            all  - the leader plus every in-sync replica confirms. (-1 is a
#                   synonym.) Combined with min.insync.replicas=2 on the topic,
#                   the message is on two brokers before you are told it landed.
#   Default: -1, which already means all - librdkafka is safe by default here
#   Why    : `all` is the only setting that makes an acknowledgement mean
#            anything. It costs one extra network hop, typically single-digit
#            milliseconds. Note it is only half the contract: acks=all with
#            min.insync.replicas=1 silently behaves like acks=1.
acks=all

# Refuse to write the same message twice, and keep messages in order.
#   Values : true, false
#   Default: false  (the Java client defaults to TRUE - a real trap)
#   Why    : without it, a retry after a timed-out-but-actually-succeeded write
#            produces a DUPLICATE, and a retry that overtakes an in-flight batch
#            REORDERS your messages. Turning it on makes the broker de-duplicate
#            using a producer id and per-partition sequence number, so a retry of
#            an already-written message is discarded by the broker.
#            It costs essentially nothing and is the single highest-value line in
#            this file. Setting it to true forces acks=all,
#            max.in.flight.requests.per.connection<=5 and retries>0; librdkafka
#            will reject the startup if you contradict any of them.
#            LIMIT: this protects one producer session writing to one partition.
#            It does NOT make a produce-then-consume pipeline atomic - that needs
#            transactions, further down.
enable.idempotence=true

# How many un-acknowledged requests may be in flight per broker connection.
#   Values : 1 .. 1000000
#   Default: 1000000
#   Why    : with enable.idempotence=true, librdkafka caps this at 5 and the
#            broker restores ordering from the sequence numbers, so you keep both
#            ordering AND pipelining. WITHOUT idempotence, anything above 1 can
#            reorder messages on retry, and 1 costs you most of your throughput.
#            That trade-off is precisely why idempotence exists.
max.in.flight.requests.per.connection=5

# How long the producer keeps trying before it gives up on a message.
#   Values : 0 .. 2147483647 ms
#   Default: 300000 (5 minutes)
#   Why    : THIS is the retry setting that matters, not `retries`. It bounds the
#            total time from your Produce() call to a final verdict, covering all
#            batching, all attempts and all backoff. `retries` defaults to
#            effectively infinite precisely so that this timeout is the real
#            limit. Set it from your business requirement: how stale can an order
#            be before sending it is worse than failing it?
#            120000 (2 min) is a common production value.
delivery.timeout.ms=120000

# Attempts per message. Kept explicit so you can see it interact with the above.
#   Values : 0 .. 2147483647
#   Default: 2147483647
#   Why    : leave it effectively unlimited and let delivery.timeout.ms decide.
#            A small number like 3 sounds prudent and is usually wrong: it makes
#            you give up during a 10-second leader election you would have ridden
#            out. Note retries only ever apply to RETRIABLE errors; a malformed
#            or oversized message fails immediately, whatever this says.
retries=2147483647

# Wait before retrying, doubling to the max, with jitter.
#   Default: 100 / 1000
#   Why    : the backoff is what stops every producer in your fleet from
#            retrying in lockstep and re-flattening a broker that is recovering.
retry.backoff.ms=100
retry.backoff.max.ms=1000

# How long the BROKER may take to answer one produce request.
#   Values : 1 .. 900000 ms
#   Default: 30000
#   Why    : with acks=all the broker holds the request until the followers
#            replicate, so this must be generous. Must be well under
#            delivery.timeout.ms, or a single slow request eats the entire
#            delivery budget and no retry ever happens.
request.timeout.ms=30000

# -----------------------------------------------------------------------------
#  2. THROUGHPUT  —  batching, which is where nearly all the performance is
# -----------------------------------------------------------------------------

# How long to wait, accumulating messages, before sending a batch.
#   Values : 0 .. 900000 ms
#   Default: 5   (the Java client defaults to 0)
#   Why    : the most misunderstood setting in Kafka. linger.ms=0 does NOT mean
#            "fast" - it means every message may travel as its own request, so
#            you pay per-request overhead on all of them and compression has one
#            message to work with, which is no compression at all. A few
#            milliseconds of waiting typically multiplies throughput several
#            times over and REDUCES p99 latency under load, because the broker
#            is no longer drowning in tiny requests.
#            0-5   : latency-critical request/response paths
#            5-20  : general purpose. Start here.
#            50-100: bulk ingest, log shipping, backfills
#            Its librdkafka alias is queue.buffering.max.ms.
linger.ms=10

# Maximum bytes in one batch to one partition.
#   Values : 1 .. 2147483647
#   Default: 1000000
#   Why    : a batch is sent when it hits this size OR when linger.ms expires,
#            whichever comes first. Too small and linger.ms never gets to do its
#            job; too large and you buffer more than you can afford to lose from
#            memory. 64 KiB - 1 MiB is the usual range. Must stay under the
#            topic's max.message.bytes or the broker rejects the whole batch.
batch.size=131072

# Maximum number of MESSAGES in one batch, checked alongside batch.size.
#   Values : 1 .. 1000000
#   Default: 10000
#   Why    : with small messages this cap is reached long before batch.size, and
#            it is the one that actually limits you. If tuning batch.size seems
#            to do nothing, this is usually why.
batch.num.messages=10000

# Compress batches at the producer.
#   Values : none - no CPU cost, maximum network and disk use
#            gzip - best ratio of the classic codecs, slowest
#            snappy - fast, modest ratio; a long-standing safe default
#            lz4 - faster than snappy at a similar ratio. Good general choice.
#            zstd - best ratio at competitive speed; needs broker >= 2.1
#   Default: none
#   Why    : compression happens per BATCH, so it works with linger.ms rather
#            than against it - bigger batches compress far better. JSON like this
#            payload typically compresses 5-10x, which cuts network, disk AND
#            replication traffic, because the broker stores the compressed batch
#            as-is when the topic uses compression.type=producer.
#            lz4 is the best default when CPU is your constraint. MEASURED on
#            this material: on a local cluster all codecs performed within noise
#            of each other, but against Confluent Cloud over a WAN link, gzip
#            beat none by 75%, well ahead of lz4 (+25%) and zstd (+30%) - because
#            there the constraint is BANDWIDTH, so the best ratio wins even at a
#            higher CPU cost. Pick the codec from the resource you are short of,
#            and measure on the network you will actually run on.
compression.type=lz4

# Codec-specific effort.
#   Values : -1 for the codec's own default, otherwise 0..12
#   Default: -1
#   Why    : leave it alone until a profile tells you compression CPU is your
#            bottleneck. For zstd, 1-3 buys most of the ratio for a fraction of
#            the cost of the higher levels.
compression.level=-1

# -----------------------------------------------------------------------------
#  3. MEMORY AND BACKPRESSURE  —  what happens when Kafka is slower than you
# -----------------------------------------------------------------------------

# How many messages may sit in the producer's send queue.
#   Values : 1 .. 10000000
#   Default: 100000
#   Why    : Produce() is asynchronous - it appends to this queue and returns.
#            The queue is your shock absorber for a broker hiccup. When it fills,
#            Produce() returns ErrQueueFull and it is YOUR job to slow down. A
#            producer that treats a full queue as fatal will crash during a
#            perfectly survivable 30-second leader election.
queue.buffering.max.messages=100000

# The same limit expressed in memory.
#   Values : 1 .. 2147483647 KB
#   Default: 1048576 (1 GiB)
#   Why    : whichever of the two limits trips first wins. Size this against your
#            container memory limit; the default will happily let the producer be
#            OOM-killed in a 512 MiB pod.
queue.buffering.max.kbytes=1048576

# Number of outstanding requests at which librdkafka starts pushing back on the
# application thread.
#   Default: 1
#   Why    : the internal early-warning system before ErrQueueFull. Leave it.
queue.buffering.backpressure.threshold=1

# Largest single message the producer will accept.
#   Values : 1000 .. 1000000000
#   Default: 1000000
#   Why    : must be <= the topic's max.message.bytes, or the broker rejects it
#            after you have already paid to serialise and send it.
message.max.bytes=1000000

# -----------------------------------------------------------------------------
#  4. ORDERING AND PARTITIONING  —  where each message actually goes
# -----------------------------------------------------------------------------

# How a message with no explicit partition is placed.
#   Values : consistent_random  - hash the key (CRC32); RANDOM when the key is
#                                 null. The default, and what you want.
#            consistent         - hash the key; all NULL keys go to ONE partition,
#                                 which creates a hotspot. Avoid.
#            murmur2_random     - hash the key with murmur2, random when null.
#                                 THIS is what the Java client does. Use it if
#                                 Java and Go producers write the same topic and
#                                 must agree on placement.
#            random             - ignore the key entirely
#            fnv1a / fnv1a_random
#   Default: consistent_random
#   Why    : partitioning is the ordering guarantee. Same key -> same partition
#            -> strict order. Cross-language fleets must agree on the hash, or
#            the same customer id lands in two partitions and ordering is gone.
partitioner=consistent_random

# When the key is null, keep sending to the SAME partition for this long instead
# of round-robining every message.
#   Values : 0 disables; otherwise 0 .. 900000 ms
#   Default: 10
#   Why    : round-robining unkeyed messages one at a time defeats batching -
#            each partition gets a trickle, so batches stay tiny and compression
#            has nothing to work with. Sticking to one partition briefly builds a
#            real batch, then moves on. Irrelevant when every message has a key,
#            as ours do.
#            MEASURED, and it catches people out: produce 2000 NULL-keyed
#            messages in a burst and ALL of them land on ONE partition, on both a
#            local cluster and Confluent Cloud. Partition choice happens when
#            Produce() is called, not when the batch is sent, and Produce() is
#            asynchronous - so the whole burst is queued inside a single 10ms
#            sticky window. Set this to 0 and the same run spreads evenly across
#            every partition. "No key" does not mean "round-robin per message";
#            it means the producer may choose, and it chooses to batch well.
sticky.partitioning.linger.ms=10

# -----------------------------------------------------------------------------
#  5. EXACTLY-ONCE  —  transactions
# -----------------------------------------------------------------------------
#
#  Idempotence above stops duplicates from RETRIES within one producer session.
#  Transactions go further: several writes across several partitions, plus the
#  consumer offsets that caused them, either all commit or all abort.
#
#  This is what makes a consume-transform-produce service exactly-once. Without
#  it, a crash between "produced the output" and "committed the input offset"
#  reprocesses the input and emits the output twice.
#
#  COST: a transactional produce is materially slower. Every commit is a
#  round-trip to the transaction coordinator, and downstream consumers must run
#  isolation.level=read_committed, which holds messages back until the
#  transaction commits. Use it where correctness is worth latency, not everywhere.

# The stable identity of this producer across restarts.
#   Values : any string, unique per logical producer instance
#   Default: (empty - transactions disabled)
#   Why    : on InitTransactions the broker uses this to FENCE any older producer
#            using the same id, so a zombie instance that was network-partitioned
#            cannot keep writing. That fencing is the entire point, and it is why
#            the id must be STABLE across restarts (from an ordinal such as a
#            StatefulSet index) and UNIQUE per instance. Two live instances
#            sharing one transactional.id will fence each other in a loop and
#            neither will make progress.
#            Uncomment, and set app.mode=transactional, for the exactly-once
#            section of the lab.
# transactional.id=orders-producer-1

# How long a transaction may stay open before the coordinator aborts it.
#   Values : 1000 .. 2147483647 ms
#   Default: 60000
#   Why    : two hard constraints, and the client refuses to START if either is
#            violated - which is far better than discovering it in production:
#
#              delivery.timeout.ms  <=  transaction.timeout.ms
#              transaction.timeout.ms  <=  the broker's transaction.max.timeout.ms
#                                          (900000 by default)
#
#            The first is the one people hit. It has to hold, because a message
#            still being retried when its transaction is force-aborted could
#            otherwise land AFTER the abort. Leave transaction.timeout.ms at the
#            default 60000 with delivery.timeout.ms=120000 above and the producer
#            exits immediately with:
#                `message.timeout.ms` must be set <= `transaction.timeout.ms`
#            (message.timeout.ms is librdkafka's older name for
#            delivery.timeout.ms - same setting, two spellings.)
#
#            It also bounds how long a read_committed consumer can be blocked by
#            your in-flight transaction, so a long timeout here becomes latency
#            over there. Keep transactions short.
transaction.timeout.ms=120000

# -----------------------------------------------------------------------------
#  6. GO CLIENT SPECIFICS  (go.* - confluent-kafka-go, not librdkafka)
# -----------------------------------------------------------------------------

# Emit one delivery report per message on the events channel.
#   Values : true, false
#   Default: true
#   Why    : the delivery report is the ONLY place a producer learns that a
#            message failed. Produce() returning nil means "queued", never
#            "delivered". Turn this off and every failure is silent. Keep it on.
go.delivery.reports=true

# How much of each message to echo back in the delivery report.
#   Values : all, none, or a comma list of key,value,headers
#   Default: all
#   Why    : the report carries a copy of the message. Set it to "none" under
#            heavy load to stop the client holding a second copy of every payload
#            in memory - but then a failed delivery report cannot tell you WHICH
#            message failed, so log enough to identify it yourself first.
go.delivery.report.fields=all

# Buffered size of the internal events channel.
#   Default: 1000000
#   Why    : delivery reports queue here. If your program is slow to drain them
#            this fills and the producer stalls, which looks exactly like a slow
#            broker. Always drain the events channel in its own goroutine.
go.events.channel.size=100000

# -----------------------------------------------------------------------------
#  PROGRAM SETTINGS (app.* - never sent to Kafka)
# -----------------------------------------------------------------------------

# Which delivery pattern to demonstrate.
#   sync          - block for each message's delivery report. Correct, and
#                   roughly two orders of magnitude slower. Only when you truly
#                   must confirm one message before deciding the next.
#   async         - fire into the queue, handle delivery reports on a separate
#                   goroutine, Flush before exit. THIS IS THE NORMAL PATTERN.
#   transactional - batch messages into transactions and commit them atomically.
#                   Requires transactional.id above.
#   fireforget    - deliberately WRONG: ignore delivery reports entirely, so you
#                   can watch how many messages vanish without a trace.
app.mode=async

# How many messages to produce. 0 means run until Ctrl+C.
app.message.count=1000

# Pause between messages. 0 sends as fast as possible.
app.interval=0s

# Messages per transaction when app.mode=transactional.
#   Why    : bigger transactions amortise the commit round-trip, so throughput
#            rises. But a read_committed consumer sees NOTHING from an open
#            transaction, so bigger transactions also mean burstier, laggier
#            delivery downstream. This is the exactly-once trade-off in one knob.
app.transaction.size=100

# Deliberately abort every Nth transaction. 0 disables.
#   Why    : an aborted transaction's messages are physically written to the log
#            and then marked aborted. A read_committed consumer skips them; a
#            read_uncommitted consumer sees them. Set this to 2, then run the
#            consumer both ways and compare the counts - that difference IS the
#            exactly-once guarantee, made visible.
#            SUBTLETY worth knowing: AbortTransaction also PURGES the producer's
#            local queue. Anything still buffered locally is dropped and never
#            reaches the broker at all, so it is not an "aborted record" - it
#            simply never existed. cmd/producer flushes before a deliberate abort
#            precisely so the messages DO reach the broker first and the demo
#            shows real aborted records rather than a local no-op.
app.transaction.abort.every=0

# How long Flush() waits for the queue to drain at shutdown.
#   Why    : Flush is the difference between a clean exit and losing everything
#            still buffered. Give it at least delivery.timeout.ms.
app.flush.timeout=30s

# Distinct customer ids to spread across the keyspace. Fewer keys means fewer
# partitions touched, which makes per-key ordering easy to observe.
app.key.cardinality=20

# Set true to send every message with a NULL key, to watch ordering guarantees
# disappear and the partitioner round-robin instead.
app.null.keys=false

app.log.format=text
app.verbose=false
