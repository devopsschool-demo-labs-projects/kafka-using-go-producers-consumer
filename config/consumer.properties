# =============================================================================
#  consumer.properties  —  PHASE 3: every knob a consumer has, and why
# =============================================================================
#
#  Load AFTER cluster.properties:
#      ./bin/consumer -cluster config/cluster.properties -config config/consumer.properties
#
#  A consumer's settings answer four questions:
#
#      1. WHO AM I?          group.id decides what you share and what you own
#      2. WHERE DO I START?  auto.offset.reset, and only on a first read
#      3. WHEN IS IT DONE?   commit strategy - the difference between
#                            at-least-once and at-most-once
#      4. AM I STILL ALIVE?  the three timeouts that trigger a rebalance
#
#  THE SINGLE MOST IMPORTANT IDEA: committing an offset is not "acknowledging a
#  message". It is a bookmark saying "if I restart, resume here". Commit BEFORE
#  you have processed and a crash loses the message. Commit AFTER and a crash
#  reprocesses it. There is no third option without transactions - which is why
#  the whole industry defaults to at-least-once and makes processing idempotent.
#
#  librdkafka defaults that differ from the Java client, and will surprise you:
#      isolation.level    librdkafka read_committed, Java read_uncommitted
#      auto.offset.reset  librdkafka "largest", Java "latest" (same meaning,
#                         different spelling - both are accepted here)
#
# -----------------------------------------------------------------------------
#  1. IDENTITY  —  group membership
# -----------------------------------------------------------------------------

# The consumer group this instance belongs to.
#   Values : any string
#   Default: (none - required for a subscribing consumer)
#   Why    : the group is the unit of work-sharing AND the unit of offset
#            storage. Every member of a group splits the partitions between them
#            and shares one set of committed offsets. Change this string and you
#            are a brand new group with no offsets, which sends you to
#            auto.offset.reset - the usual cause of "my consumer suddenly
#            reprocessed everything".
#            Two applications that must EACH see every message need two different
#            group.ids, not two members of one group.
group.id=orders-consumer

# A stable identity that survives a restart (static group membership, KIP-345).
#   Values : any string, unique within the group
#   Default: (empty - dynamic membership)
#   Why    : normally, leaving the group triggers an immediate rebalance and
#            rejoining triggers another. With a group.instance.id the broker holds
#            your partitions for up to session.timeout.ms, so a rolling restart or
#            a pod reschedule causes NO rebalance at all. This is the single
#            biggest reduction in rebalance pain for a Kubernetes deployment - set
#            it from the StatefulSet ordinal.
#            COST: a genuinely dead instance is not detected until
#            session.timeout.ms expires, rather than immediately.
# group.instance.id=consumer-1

# Which rebalance protocol the group speaks.
#   Values : classic  - the original protocol, implemented in the client
#            consumer - KIP-848, the next-generation protocol where the BROKER
#                       computes the assignment. Far faster rebalances and no
#                       client-side assignor. Needs Kafka 4.0+ / Confluent Cloud.
#   Default: classic
#   Why    : leave it classic unless your cluster supports KIP-848. Confluent
#            Cloud does; the local Docker cluster in docker/ runs Kafka 3.9 and
#            does not. Note that with group.protocol=consumer the
#            partition.assignment.strategy below is ignored - the broker decides.
# group.protocol=consumer

# -----------------------------------------------------------------------------
#  2. STARTING POSITION
# -----------------------------------------------------------------------------

# Where to begin when there is NO committed offset for this group, or when the
# committed offset no longer exists because retention deleted it.
#   Values : earliest (a.k.a. smallest) - replay everything still retained
#            latest   (a.k.a. largest)  - only messages produced from now on
#            error                      - refuse to start, raise an error instead
#   Default: largest
#   Why    : READ THE CONDITION AGAIN - this applies only when there is no valid
#            committed offset. It is NOT "always start from the beginning"; an
#            existing group resumes from its commit and ignores this entirely.
#            earliest is right for a new pipeline you want backfilled, and for
#            this lab, where you want to see the messages you just produced.
#            latest is right for a live monitor that must not drown in history.
#            error is the honest choice for a critical consumer: rather than
#            silently skipping or silently replaying, it makes a human decide.
auto.offset.reset=earliest

# Hide or surface aborted transactional messages.
#   Values : read_committed   - skip messages from aborted transactions, and
#                               refuse to advance past an OPEN transaction
#            read_uncommitted - deliver everything the moment it is written
#   Default: read_committed  (the Java client defaults to read_uncommitted)
#   Why    : this is the consumer half of exactly-once. With read_committed the
#            consumer cannot read past the Last Stable Offset, so a long-running
#            producer transaction directly adds consumer latency - keep producer
#            transactions short.
#            Run the producer with app.transaction.abort.every=3, then read this
#            topic both ways: the count difference is the guarantee, made visible.
isolation.level=read_committed

# -----------------------------------------------------------------------------
#  3. COMMIT STRATEGY  —  where at-least-once actually comes from
# -----------------------------------------------------------------------------

# Commit offsets on a timer in the background.
#   Values : true, false
#   Default: true
#   Why    : convenient and WRONG for anything that matters. The timer does not
#            know whether you finished processing. A commit can fire for a
#            message you are still working on; crash now and it is skipped
#            forever - silent data loss with no error anywhere.
#            The pattern below (auto-commit ON, auto-offset-STORE off) gives you
#            correctness AND efficiency: you decide which offsets are eligible,
#            librdkafka batches the network calls.
#            Set app.mode=autocommit to see the unsafe version's behaviour.
enable.auto.commit=true

# How often the background committer runs.
#   Default: 5000
#   Why    : this is your worst-case reprocessing window on a crash. Five seconds
#            of duplicates is usually fine; if it is not, you need manual commits,
#            not a smaller number here - shrinking it just adds broker load
#            without ever removing the race.
auto.commit.interval.ms=5000

# Automatically mark a message's offset as eligible for commit the moment it is
# HANDED to your code.
#   Values : true, false
#   Default: true
#   Why    : librdkafka-specific, and the key to doing this properly. Leave it
#            true and the offset is stored before you have processed anything -
#            that is where the auto-commit data loss comes from. Set it FALSE and
#            nothing is eligible until you explicitly call StoreOffsets AFTER
#            processing succeeds. Combined with enable.auto.commit=true you get
#            at-least-once semantics with batched, asynchronous commits: correct
#            and fast. This is the recommended production pattern.
enable.auto.offset.store=false

# -----------------------------------------------------------------------------
#  4. LIVENESS  —  the three timeouts, and which rebalance each one causes
# -----------------------------------------------------------------------------
#
#  Two entirely separate failure detectors, routinely confused:
#
#    session.timeout.ms   watches a BACKGROUND heartbeat thread. It fires when
#                         the process is gone: crashed, killed, partitioned.
#    max.poll.interval.ms watches YOUR loop. It fires when the process is alive
#                         but stuck - a slow database call, a lock, a GC pause.
#
#  A consumer that stops calling Poll but keeps heartbeating is the classic
#  "consumer group rebalances forever" outage. max.poll.interval.ms is what
#  catches it.

# How long the broker waits for a heartbeat before declaring you dead.
#   Values : 1 .. 3600000 ms  (brokers usually enforce 6000..1800000)
#   Default: 45000
#   Why    : Confluent Cloud recommends 45000, which is the default here. Lower
#            it and a transient network blip evicts a healthy consumer and
#            triggers a rebalance; raise it and a genuinely dead consumer's
#            partitions sit unprocessed for that much longer.
session.timeout.ms=45000

# How often the background thread heartbeats.
#   Default: 3000
#   Why    : must be well under session.timeout.ms - a third is the convention,
#            so several heartbeats can be lost before eviction. 45000/3000 = 15x,
#            comfortably safe.
heartbeat.interval.ms=3000

# The longest your code may go between Poll calls before the group evicts you.
#   Default: 300000 (5 minutes)
#   Why    : set it from your SLOWEST realistic processing time for one batch,
#            with headroom. Too low and a slow batch gets you evicted mid-work,
#            your partitions move, and the new owner reprocesses - which can
#            cascade into a rebalance storm as each new owner is evicted in turn.
#            Too high and a genuinely wedged consumer holds its partitions for
#            that long. If you cannot bound processing time, do the work off the
#            poll thread and use Pause/Resume for backpressure.
#            CONSTRAINT: max.poll.interval.ms must be >= session.timeout.ms, and
#            the client refuses to start otherwise:
#                `max.poll.interval.ms`must be >= `session.timeout.ms`
#            So lowering this for an experiment means lowering session.timeout.ms
#            with it - 6000 is the floor most brokers accept, because
#            group.min.session.timeout.ms defaults to 6000.
max.poll.interval.ms=300000

# -----------------------------------------------------------------------------
#  5. REBALANCE STRATEGY  —  how partitions are handed out
# -----------------------------------------------------------------------------

# The assignor, used when group.protocol=classic.
#   Values : range             - per topic, hand out contiguous ranges. Default,
#                                and it SKEWS: with 12 partitions over 5
#                                consumers you get 3,3,2,2,2. Across several
#                                topics the same members are over-loaded every
#                                time.
#            roundrobin        - deal partitions out one at a time across all
#                                topics. Much more even, but every rebalance
#                                reassigns everything.
#            cooperative-sticky - keep existing assignments where possible and
#                                move only what must move. Rebalances become
#                                INCREMENTAL: consumers that keep their
#                                partitions never stop consuming.
#   Default: range,roundrobin
#   Why    : cooperative-sticky, every time. The others use "eager" rebalancing:
#            EVERY consumer revokes EVERY partition and the whole group stops
#            until the new assignment is agreed - a stop-the-world pause on each
#            scale event. Cooperative rebalancing removes that pause.
#            MIGRATION WARNING: you cannot mix eager and cooperative members in
#            one group. Moving an existing group across needs a documented
#            two-step rolling upgrade, or a full stop and restart.
partition.assignment.strategy=cooperative-sticky

# Forward rebalance events to the Events() CHANNEL.
#   Values : true, false
#   Default: false
#   Why    : READ THIS CAREFULLY, because it is easy to get wrong and the failure
#            is silent. This property only applies to the CHANNEL-based consumer,
#            the one that reads from Events(). A Poll()-based consumer - which is
#            what cmd/consumer uses, and what you should use - will NEVER see
#            AssignedPartitions or RevokedPartitions from Poll, no matter what
#            this is set to.
#
#            For a Poll()-based consumer you take control of rebalances by
#            passing a RebalanceCb to Subscribe:
#
#                c.Subscribe(topic, myRebalanceCallback)
#
#            Pass nil instead and librdkafka assigns partitions silently, which
#            costs you the only moment where you can commit offsets for a
#            partition you are about to lose. Everything since your last commit
#            is then redone by whichever consumer picks it up.
#
#            Left true here so the setting is visible and documented; the
#            callback in cmd/consumer/main.go is what actually does the work.
go.application.rebalance.enable=true

# -----------------------------------------------------------------------------
#  6. FETCH TUNING  —  the latency / throughput dial
# -----------------------------------------------------------------------------

# Minimum bytes a broker should accumulate before answering a fetch.
#   Values : 1 .. 100000000
#   Default: 1
#   Why    : 1 means "reply immediately, even with a single message" - lowest
#            latency, most requests. Raise it to ~100000 and the broker waits for
#            a worthwhile amount of data, cutting request rate dramatically at the
#            cost of up to fetch.wait.max.ms of latency. This pair is the
#            consumer's equivalent of the producer's linger.ms/batch.size.
fetch.min.bytes=1

# How long the broker may wait for fetch.min.bytes before answering anyway.
#   Default: 500
#   Why    : the ceiling on the latency that fetch.min.bytes can add. With
#            fetch.min.bytes=1 it is almost never reached.
fetch.wait.max.ms=500

# Maximum data returned per partition in one fetch.
#   Default: 1048576 (1 MiB)
#   Why    : must be >= the topic's max.message.bytes, or a single large message
#            can never be fetched and the consumer STALLS on it forever with no
#            obvious error. Multiply by your partition count to size memory.
max.partition.fetch.bytes=1048576

# Maximum data returned across all partitions in one fetch.
#   Default: 52428800 (50 MiB)
#   Why    : the real memory ceiling per fetch. A consumer owning 50 partitions
#            at 1 MiB each would otherwise ask for 50 MiB in one go.
fetch.max.bytes=52428800

# Deliver a synthetic message when a partition's end is reached.
#   Values : true, false
#   Default: false
#   Why    : off for a long-running service - "caught up" is not an event you act
#            on. Invaluable for a batch job or a test that must know when it has
#            drained the topic, which is exactly how app.exit.on.eof works here.
enable.partition.eof=false

# -----------------------------------------------------------------------------
#  PROGRAM SETTINGS (app.* - never sent to Kafka)
# -----------------------------------------------------------------------------

# Which consumption pattern to demonstrate.
#   manual     - process, then StoreOffsets. At-least-once, done correctly.
#                THIS IS THE ONE TO COPY.
#   autocommit - let the timer commit whatever it likes, whenever it likes.
#                At-most-once in disguise: shows how messages go missing.
#   eos        - consume-transform-produce inside a transaction, with the input
#                offsets committed via SendOffsetsToTransaction. End-to-end
#                exactly-once.
#   atmostonce - commit BEFORE processing. Deliberately wrong, and the fastest
#                way to see the difference the ordering makes.
app.mode=manual

# Stop after this many messages. 0 means run until Ctrl+C.
app.max.messages=0

# Stop once every assigned partition has reached its end. Needs
# enable.partition.eof=true. Used by the automated checks.
app.exit.on.eof=false

# Simulated per-message processing time. Raise it above max.poll.interval.ms
# divided by the batch size to trigger the eviction described in section 4.
app.process.time=0s

# Fraction of messages that fail processing, 0.0 to 1.0. Drives the dead-letter
# path below so you can watch a poison message get quarantined rather than
# blocking the partition forever.
app.fail.rate=0.0

# Where failed messages go. A message that can never succeed must be moved aside;
# retrying it forever blocks its partition and everything behind it.
app.dlq.topic=orders-dlq

# How many attempts before a message is sent to the dead-letter topic.
app.max.attempts=3

# For app.mode=eos: the topic transformed messages are written to, and the
# transactional id of the embedded producer.
app.output.topic=orders-processed
app.output.transactional.id=orders-eos-1

# Print every message as it arrives. Off by default - it is a lot of output.
app.print.messages=false

# How often to print a progress line.
app.progress.every=1000

app.log.format=text
app.verbose=false
