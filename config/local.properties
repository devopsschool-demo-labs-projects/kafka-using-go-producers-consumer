# =============================================================================
#  local.properties  —  OFFLINE OVERLAY for docker/docker-compose.yml
# =============================================================================
#
#  Load it AFTER cluster.properties to point everything at the local brokers:
#
#      ./bin/producer -cluster config/cluster.properties,config/local.properties
#
#  Only the connection differs. Every producer, consumer and topic setting you
#  learn against Confluent Cloud applies here unchanged, which is the point.
# -----------------------------------------------------------------------------

# Three local brokers. Listing all three means the client can still bootstrap
# when one is down - which the failure exercises in LAB.md rely on.
bootstrap.servers=localhost:9092,localhost:9094,localhost:9096

# No TLS and no authentication. Acceptable ONLY because this broker is on your
# laptop and reachable by nothing else. Never set this against a remote cluster:
# with sasl_plaintext your API secret crosses the network in the clear.
security.protocol=PLAINTEXT

# Blank out the Confluent Cloud credentials. librdkafka rejects the combination
# of security.protocol=PLAINTEXT with SASL credentials set.
sasl.mechanisms=
sasl.username=
sasl.password=
