# =============================================================================
#  cluster.properties  —  connection and authentication
#  Loaded FIRST by all three programs, then overlaid by topic/producer/consumer.
# =============================================================================
#
#  HOW TO READ THIS FILE
#
#    Every key that does NOT start with "app." is a real Kafka / librdkafka
#    property name, spelled exactly as Confluent spells it. It is passed to the
#    client verbatim. Keys starting with "app." are read by this training
#    program only and never reach Kafka.
#
#    Each property below is written as:
#        # Values : what else you may set
#        # Default: what the library uses if you say nothing
#        # Why    : the trade-off you are making
#
#  CREDENTIALS ARE NEVER STORED HERE. ${NAME} is expanded from the environment
#  at load time, and the program refuses to start if the variable is unset.
#  Before running anything:
#
#      export KAFKA_BOOTSTRAP_SERVERS="pkc-xxxxx.us-east-1.aws.confluent.cloud:9092"
#      export KAFKA_API_KEY="your-api-key"
#      export KAFKA_API_SECRET="your-api-secret"
#
# -----------------------------------------------------------------------------
#  CONNECTION
# -----------------------------------------------------------------------------

# The cluster endpoint. On Confluent Cloud this is the "Bootstrap server" shown
# under Cluster settings. It is a bootstrap only: the client connects once,
# fetches the real broker list from metadata, then talks to the leaders directly.
#   Values : host:port, comma-separated for several bootstrap endpoints
#   Default: (none - required)
#   Why    : list two or three endpoints so a single dead broker cannot stop
#            your client from ever discovering the cluster.
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# How the connection is encrypted and authenticated.
#   Values : plaintext        - no TLS, no auth. Local Docker only, never remote.
#            ssl              - TLS, client authenticated by mTLS certificate.
#            sasl_plaintext   - SASL auth over an UNENCRYPTED socket. Your API
#                               secret crosses the network in the clear with
#                               PLAIN. Only ever acceptable inside a VPC.
#            sasl_ssl         - SASL auth inside TLS. What Confluent Cloud requires.
#   Default: plaintext
#   Why    : Confluent Cloud accepts nothing but sasl_ssl. If you switch this to
#            plaintext to test against a local broker, also blank out the two
#            sasl.* credentials below or librdkafka will reject the combination.
security.protocol=SASL_SSL

# The SASL mechanism.
#   Values : PLAIN            - username/password. On Confluent Cloud the
#                               "username" is your API key and the "password" is
#                               its secret. Safe here only because SSL wraps it.
#            SCRAM-SHA-256    - challenge/response, password never sent. Offered
#            SCRAM-SHA-512      by Confluent Platform and some Cloud configs.
#            OAUTHBEARER      - short-lived OIDC tokens. The production-grade
#                               choice: credentials expire on their own.
#            GSSAPI           - Kerberos, typical in on-prem enterprise estates.
#   Default: GSSAPI
#   Why    : PLAIN + API keys is what Confluent Cloud hands you on day one.
#            Move to OAUTHBEARER when you want rotation without redeploying.
#            Note the property is plural - "sasl.mechanisms", not the Java
#            client's singular "sasl.mechanism". librdkafka accepts both.
sasl.mechanisms=PLAIN

# Confluent Cloud API key and secret.
#   Why    : these are cluster credentials, not user credentials. Issue one key
#            per application with only the ACLs it needs, so revoking a leaked
#            producer key does not take your consumers down with it.
sasl.username=${KAFKA_API_KEY}
sasl.password=${KAFKA_API_SECRET}

# Where to find the CA bundle that validates the broker's TLS certificate.
#   Values : a path to a PEM file, or "probe" to search the usual system paths
#   Default: (empty - use the OpenSSL default store)
#   Why    : leave this unset on macOS and most Linux distributions; Confluent
#            Cloud uses a publicly trusted CA. Set it only if you hit
#            "broker certificate could not be verified" behind a TLS-inspecting
#            corporate proxy. Never "fix" that error by disabling verification.
# ssl.ca.location=/etc/ssl/certs/ca-certificates.crt

# -----------------------------------------------------------------------------
#  IDENTITY AND OBSERVABILITY
# -----------------------------------------------------------------------------

# A label this client reports to the broker.
#   Values : any string
#   Default: rdkafka
#   Why    : it shows up in broker logs, in Confluent Cloud's client metrics and
#            in quota decisions. "rdkafka" tells an on-call engineer nothing at
#            3am. Each program overrides this with its own name.
client.id=kafka-training

# How often librdkafka emits a full statistics JSON blob on its event channel.
#   Values : 0 disables; otherwise 1000 .. 86400000 ms
#   Default: 0
#   Why    : this blob carries queue depth, broker RTT, retries and consumer lag
#            per partition. It is the single best production observability hook
#            the client offers. Left off here because it is verbose; the lab
#            turns it on deliberately. 60000 is a sane production value.
statistics.interval.ms=0

# Route librdkafka's own internal log lines to a Go channel.
#   Values : true, false
#   Default: false
#   Why    : with app.verbose=true this shows broker connects, metadata
#            refreshes, rebalances and retry decisions - the detail you need
#            when a client "just hangs". Costs nothing when quiet.
go.logs.channel.enable=true

# Turn on librdkafka's internal diagnostics.
#   Values : a comma list of - generic, broker, topic, metadata, feature, queue,
#            msg, protocol, cgrp, security, fetch, interceptor, plugin, consumer,
#            admin, eos, mock, assignor, conf, telemetry, all
#   Default: (empty - off)
#   Why    : the first thing to reach for when a client "just times out". A
#            delivery report tells you the final VERDICT ("Message timed out"),
#            never the retriable cause that was retried a hundred times to get
#            there. debug=broker,msg shows the cause. Use cgrp for rebalance
#            problems, eos for transactions, metadata for topic discovery.
#            Very verbose - turn it on for one run, not in production.
#            Needs app.verbose=true as well, since these arrive at debug level.
# debug=broker,msg

# -----------------------------------------------------------------------------
#  NETWORK RESILIENCE
# -----------------------------------------------------------------------------

# Resolve every A record a bootstrap hostname returns, not just the first.
#   Values : use_all_dns_ips, resolve_canonical_bootstrap_servers_only
#   Default: use_all_dns_ips
#   Why    : Confluent Cloud bootstrap names resolve to several load-balancer
#            addresses. Trying all of them survives one bad address.
client.dns.lookup=use_all_dns_ips

# Send TCP keepalives on idle broker connections.
#   Values : true, false
#   Default: false
#   Why    : cloud NAT gateways and corporate firewalls silently drop idle TCP
#            connections. Without keepalives the client discovers this only when
#            it next tries to send, as a mystifying timeout. Turn it on.
socket.keepalive.enable=true

# Close a broker connection that has been idle this long.
#   Values : 0 disables; otherwise milliseconds
#   Default: 0
#   Why    : Confluent Cloud's own guidance is 180000, comfortably under the
#            typical cloud load-balancer idle timeout, so the client closes the
#            connection tidily instead of inheriting a half-dead one.
connections.max.idle.ms=180000

# Wait this long before reconnecting to a broker that just failed, doubling up
# to the max, with jitter.
#   Default: 100 / 10000
#   Why    : the backoff is what stops a thundering herd of clients from
#            hammering a broker that is trying to come back up.
reconnect.backoff.ms=100
reconnect.backoff.max.ms=10000

# How long a single broker request may take before the client gives up on it.
#   Default: 60000
#   Why    : this is a socket-level ceiling. It must stay comfortably ABOVE the
#            producer's request.timeout.ms, or the socket dies before the
#            producer's own retry logic ever gets a chance to run.
socket.timeout.ms=60000

# How often to refresh the topic/partition map even when nothing looks wrong.
#   Values : -1 disables; otherwise milliseconds
#   Default: 300000
#   Why    : this is how a client notices that partitions were added or that
#            leadership moved. Lower it and you add metadata load; disable it
#            and your client will keep producing to a partition layout that no
#            longer exists.
topic.metadata.refresh.interval.ms=300000

# Let a producer or consumer create a topic implicitly by naming one.
#   Values : true, false
#   Default: false
#   Why    : keep it false. Auto-creation gives you a topic with default
#            partition count and default retention that nobody chose, usually
#            discovered weeks later. Confluent Cloud disables it cluster-wide
#            anyway. Topics are created deliberately - that is Phase 1.
allow.auto.create.topics=false

# -----------------------------------------------------------------------------
#  PROGRAM SETTINGS (app.* - never sent to Kafka)
# -----------------------------------------------------------------------------

# The topic every program in this package reads or writes.
app.topic=orders

# Print librdkafka's internal log lines and extra per-message detail.
app.verbose=false

# text for a human at a projector, json for a log collector.
app.log.format=text
