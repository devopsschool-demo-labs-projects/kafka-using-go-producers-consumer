# =============================================================================
#  topic.properties  —  PHASE 1: the topic, its partitions, its durability
# =============================================================================
#
#  Loaded as its OWN config object, NOT merged into the client connection
#  settings. That separation matters: "retention.ms" is a broker-side topic
#  config, while "linger.ms" is a client-side producer config. They live in
#  different namespaces on the cluster, and librdkafka rejects an unknown client
#  property outright, so mixing them is a startup error rather than a subtlety.
#
#    app.*        -> arguments to CreateTopics (name, partitions, replicas)
#    everything   -> a topic config ENTRY, name spelled exactly as Kafka spells
#    else            it, applied at creation and changeable later with
#                    `topicadmin alter`.
#
#  MANAGED-CLUSTER REALITY: Confluent Cloud locks some of these. Rather than
#  trusting a table in a document that will go stale, run
#
#      ./bin/topicadmin -cmd describe
#
#  which asks YOUR cluster which entries are read-only and where each value came
#  from. Anything the cluster refuses is reported by name, not silently dropped.
#
# -----------------------------------------------------------------------------
#  SHAPE OF THE TOPIC  (CreateTopics arguments, not config entries)
# -----------------------------------------------------------------------------

app.topic=orders

# Partitions are the unit of parallelism AND the unit of ordering. Kafka orders
# messages within a partition and makes no promise across partitions. One
# consumer instance in a group owns whole partitions, so the partition count is
# the hard ceiling on how many consumers in a group can do useful work: 6
# partitions means a 7th consumer sits idle.
#   Values : 1 .. cluster limit (Confluent Cloud Basic allows far more than you
#            need here; Dedicated raises it further)
#   Default: 6 on Confluent Cloud, 1 on a stock local broker
#   Why    : 6 divides evenly by 1, 2, 3 and 6, so a group of any of those sizes
#            balances perfectly - which makes rebalance demonstrations tidy.
#            Sizing rule of thumb: target throughput divided by the throughput a
#            single consumer sustains, then round up and leave headroom.
#            CAUTION: partitions can be INCREASED but never decreased, and
#            increasing them changes which partition a given key hashes to,
#            breaking per-key ordering for keys already in flight.
app.num.partitions=6

# Copies of each partition across brokers.
#   Values : 1 (no redundancy) .. number of brokers
#   Default: 3 on Confluent Cloud, and NOT changeable there
#   Why    : 3 tolerates one broker loss with room to still satisfy
#            min.insync.replicas=2. Confluent Cloud enforces 3 for you; set -1
#            to accept the cluster default rather than fight it.
app.replication.factor=3

# -----------------------------------------------------------------------------
#  DURABILITY  —  the settings that decide whether an acknowledged write survives
# -----------------------------------------------------------------------------

# How many replicas must confirm a write before the leader acknowledges it,
# when and ONLY when the producer sends acks=all.
#   Values : 1 or 2 on Confluent Cloud (the platform rejects anything else)
#            1 .. replication.factor on self-managed clusters
#   Default: 1 on a stock broker, 2 on Confluent Cloud
#   Why    : this is one half of a two-part contract; the other half is the
#            producer's acks. With RF=3 and min.insync.replicas=2, a write is on
#            two brokers before it is acknowledged, so losing one loses nothing.
#            Set it to 1 and acks=all silently degrades to acks=1 - the producer
#            cannot tell, and you find out during the outage.
#            Set it EQUAL to replication.factor and any single broker going
#            offline makes the partition unwritable: you have traded all your
#            availability for a durability gain you already had.
min.insync.replicas=2

# Whether a replica that has fallen out of sync may be elected leader.
#   Values : false - an unavailable partition rather than lost data
#            true  - availability at the cost of silently discarding
#                    acknowledged messages
#   Default: false
#   Why    : leave it false. `true` is how "Kafka lost my data" happens: an
#            out-of-date replica becomes leader and every message it never
#            received is gone, with no error anywhere.
#            Confluent Cloud fixes this at false and will reject a change -
#            `topicadmin describe` will show it as read-only.
# unclean.leader.election.enable=false

# -----------------------------------------------------------------------------
#  RETENTION  —  how long the log keeps data
# -----------------------------------------------------------------------------

# What happens to old segments.
#   Values : delete          - discard by age or size. Event streams.
#            compact         - keep the newest value per key forever. Changelogs
#                              and lookup tables; a null value is a tombstone
#                              that deletes the key.
#            compact,delete  - compact, and also drop anything past retention.ms.
#   Default: delete
#   Why    : orders are events, so delete. NOTE a Confluent Cloud quirk: you
#            cannot go straight from `delete` to `compact,delete`. Change it to
#            `compact` first, then to `compact,delete`.
cleanup.policy=delete

# How long to keep a message.
#   Values : -1 for infinite retention (Confluent Cloud Infinite Storage)
#            otherwise milliseconds
#   Default: 604800000 (7 days)
#   Why    : retention is your replay window. It is what lets a broken consumer
#            be fixed and restarted from an old offset instead of losing the
#            data. Set it from how long you would realistically take to notice
#            and fix a bug, not from disk cost.
#            Common values: 3600000 = 1 hour, 86400000 = 1 day,
#            604800000 = 7 days, 2592000000 = 30 days.
retention.ms=604800000

# Size cap per PARTITION (not per topic) before old segments are dropped.
#   Values : -1 for no size limit; otherwise bytes
#   Default: -1
#   Why    : a belt-and-braces guard against one hot partition filling a disk.
#            Whichever of retention.ms and retention.bytes trips first wins, so
#            setting bytes can silently shorten your replay window well below
#            the retention.ms you thought you had.
retention.bytes=-1

# Roll to a new log segment after this long, even if it is not full.
#   Values : milliseconds (60000 minimum on most clusters)
#   Default: 604800000 (7 days)
#   Why    : retention only ever deletes CLOSED segments, so nothing expires
#            until a segment rolls. With the 7-day default and low traffic, a
#            1-hour retention.ms appears to do nothing at all - a classic
#            "retention is broken" support ticket. Set it well below
#            retention.ms. 3600000 (1 hour) makes expiry observable in a lab.
segment.ms=3600000

# Roll to a new segment once the current one reaches this size.
#   Values : bytes
#   Default: 1073741824 (1 GiB)
#   Why    : smaller segments expire more promptly and compact sooner, at the
#            cost of more open files. 1 GiB is right for real traffic; the
#            100 MiB here just makes segment behaviour visible in a lab.
segment.bytes=104857600

# -----------------------------------------------------------------------------
#  MESSAGE HANDLING
# -----------------------------------------------------------------------------

# Largest single batch the broker will accept.
#   Values : bytes
#   Default: 1048588 (1 MiB plus overhead)
#   Why    : must be >= the producer's own message limit or the producer gets
#            MSG_SIZE_TOO_LARGE on send. Raising it costs broker memory and
#            replication latency for every partition. If you are tempted past a
#            few MiB, put the payload in object storage and send the URL.
max.message.bytes=1048588

# Whether the broker re-compresses.
#   Values : producer - keep the producer's codec, no broker-side CPU cost
#            gzip, snappy, lz4, zstd - force one codec regardless of producer
#            uncompressed - force decompression
#   Default: producer
#   Why    : `producer` is almost always right. Compressing at the producer
#            means the batch travels compressed AND is stored compressed AND
#            replicates compressed - you pay CPU once and save network three
#            times. Forcing a codec here makes the broker decompress and
#            recompress every batch.
compression.type=producer

# Which timestamp the broker stores against a message.
#   Values : CreateTime - the time the producer set (when the event happened)
#            LogAppendTime - the time the broker wrote it (when it arrived)
#   Default: CreateTime
#   Why    : CreateTime is what you want for event-time processing and for
#            offsetsForTimes to mean anything useful. LogAppendTime is
#            monotonic and immune to a producer with a wrong clock, but it
#            destroys the original event time. Keep CreateTime and validate
#            clocks instead.
message.timestamp.type=CreateTime

# -----------------------------------------------------------------------------
#  COMPACTION  —  only consulted when cleanup.policy includes `compact`
# -----------------------------------------------------------------------------
# Left commented out because this topic uses cleanup.policy=delete. LAB.md has
# you switch the policy and turn these on to watch compaction actually happen.

# How long a tombstone (a null value marking a key deleted) survives, giving
# every consumer a chance to observe the deletion before it is cleaned away.
#   Default: 86400000 (24 hours)
#   Why    : shorter than your slowest consumer's downtime and a consumer will
#            miss the delete entirely, keeping the key forever.
# delete.retention.ms=86400000

# How long a message stays ineligible for compaction after being written.
#   Default: 0
#   Why    : raise it to guarantee a consumer can still read every intermediate
#            value for a key for at least this long.
# min.compaction.lag.ms=0

# Force compaction of a segment this long after it becomes dirty.
#   Default: 9223372036854775807 (effectively never)
#   Why    : without it, a low-traffic partition may never reach the dirty ratio
#            below and so never compacts - your "latest value per key" topic
#            just grows.
# max.compaction.lag.ms=604800000

# How dirty a log must get before the cleaner bothers.
#   Values : 0.0 (compact constantly, high CPU) .. 1.0 (almost never)
#   Default: 0.5
#   Why    : lower it to keep the log tighter and reads faster, at the cost of
#            steady cleaner CPU.
# min.cleanable.dirty.ratio=0.5
